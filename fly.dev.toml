# Fly.io config for the dev copy of hosted Portico, at dev.portico.chat. Its data, bucket and sign-in project are its
# own: nothing here touches the live app.
#   fly deploy -c fly.dev.toml --ha=false
# Secrets (fly secrets set): PORTICO_FILES_BUCKET and the bucket's keys from `fly storage create`, and
# PORTICO_RESEND_API_KEY.
app = "portico-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTICO_DATA_DIR = "/data/portico"
  PORTICO_PUBLIC_URL = "https://dev.portico.chat"
  # The dev sign-in project. A project ID is public: the sign-in page shows the same value.
  PORTICO_DESCOPE_PROJECT_ID = "P3MJNT5ZQa28nKZ4hv7GP4Jqo4Ic"
  PORTICO_MAIL_FROM = "Portico Dev <no-reply@mail.portico.chat>"
  PORTICO_PLUGIN_SOURCE = "king-of-the-grackles/portico"

# SQLite lives on one volume, so Portico runs on one machine: deploy with --ha=false.
[mounts]
  source = "portico_dev_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8790
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
