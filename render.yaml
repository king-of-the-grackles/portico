# Render Blueprint for Portico. Nothing to fill in: Portico keeps the database and signing key
# on the disk at /data. After the first deploy, open the service's Shell and run `portico setup`.
# A persistent disk needs a paid instance type (Starter or above).
services:
  - type: web
    name: portico
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Deploys only when someone chooses to, not on every push to this repo.
    autoDeployTrigger: "off"
    envVars:
      # Where /join tells computers to install the Claude Code plugin from.
      - key: PORTICO_PLUGIN_SOURCE
        value: king-of-the-grackles/portico
    disk:
      name: portico-data
      mountPath: /data
      sizeGB: 1
