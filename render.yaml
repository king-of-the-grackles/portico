# Render Blueprint for Portico (docs/deploy/cloud.md). Nothing to fill in: Portico keeps its database and signing key
# on the disk at /data. After the first deploy, open the service's Shell and run `portico setup`.
# A persistent disk needs a paid instance type (Starter or above).
services:
  - type: web
    name: portico
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    disk:
      name: portico-data
      mountPath: /data
      sizeGB: 1
