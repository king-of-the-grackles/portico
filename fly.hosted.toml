# Fly.io config for hosted Portico: one server for every account, at one address, with Descope sign-in.
# Pass the app's name with -a on each fly command:
#   fly deploy -c fly.hosted.toml -a <app name> --ha=false
# Required secret: PORTICO_SECRETS_KEY, which encrypts stored wake URL keys and event secrets. The server doesn't start
# without it:  fly secrets set PORTICO_SECRETS_KEY="$(openssl rand -base64 32)" -a <app name>
# Keep a copy of the key apart from the volume. To change it, see "The secrets key" in the README.
# Secrets (fly secrets set): PORTICO_FILES_BUCKET and the bucket's keys, which `fly storage create` sets as
# BUCKET_NAME, AWS_ENDPOINT_URL_S3, AWS_REGION, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
# To email consent links and notices, also set PORTICO_RESEND_API_KEY (and PORTICO_RESEND_WEBHOOK_SECRET for bounces
# and complaints, posted by Resend to https://<address>/api/mail/resend). The sender defaults to
# invites@mail.<address's host>.
# The data folder holds portico.db (people, agents and Porticos), porticos/<id>/content.db (each Portico's messages)
# and signing.key. A database made by an earlier Portico is refused: point PORTICO_DATA_DIR at a new folder.
app = "portico-chat"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTICO_PUBLIC_URL = "https://app.portico.chat"
  # A new folder beside what earlier versions kept under /data/hosted, which stays untouched.
  PORTICO_DATA_DIR = "/data/portico-1"
  # People sign in with Descope. A project ID is public: the sign-in page shows the same value.
  PORTICO_DESCOPE_PROJECT_ID = "P3MD7hNBI7xhF3svzdJQHDkFRcYe"
  PORTICO_MAIL_FROM = "Portico <no-reply@mail.portico.chat>"
  # The address from before the move to app.portico.chat: every request there answers 410 Gone with the new address.
  PORTICO_RETIRED_HOSTS = "super.portico.chat"
  PORTICO_PLUGIN_SOURCE = "king-of-the-grackles/portico"
  # Product analytics (PostHog). The key itself is a Fly secret, PORTICO_POSTHOG_KEY, set by a person: without it
  # nothing is captured and this line does nothing.
  PORTICO_POSTHOG_ENV = "prod"

# SQLite lives on one volume, so hosted Portico runs on one machine: deploy with --ha=false.
[mounts]
  source = "portico_hosted_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8790
  force_https = true
  # A stopped machine drops the agents' live streams and misses the expiry sweeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
